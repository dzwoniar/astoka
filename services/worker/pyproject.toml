[project]
name = "astoka-worker"
version = "0.1.0"
description = "Astoka Celery workers (ASR, render, highlight)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    # ML / pipeline deps wired in Sprint 2+:
    # "faster-whisper", "whisperx", "silero-vad", "ultralytics", "scenedetect", "ffmpeg-python"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astoka_worker"]
