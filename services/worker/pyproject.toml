[project]
name = "astoka-worker"
version = "0.1.0"
description = "Astoka Celery workers (ASR, render, highlight)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "yt-dlp>=2025.1.0",
    "ffmpeg-python>=0.2.0",
    # Worker shares ORM models with API to avoid duplication.
    "astoka-api",
    # ML deps (Phase C: ASR; Phase D: scene detect + audio scoring + LLM client):
    "faster-whisper>=1.0.3",
    "scenedetect>=0.6.4",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # Phase D-future: silero-vad, ultralytics (face detection); skipped in MVP backbone.
]

[tool.uv.sources]
astoka-api = { path = "../api", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astoka_worker"]
