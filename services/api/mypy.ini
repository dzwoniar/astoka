[mypy]
python_version = 3.11
# Less strict in Sprint 1 — we'll tighten in Sprint 7 (testing/hardening).
# Keeping check_untyped_defs ensures real type errors still caught.
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-minio.*]
ignore_missing_imports = True
