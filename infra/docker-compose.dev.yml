# Astoka — DEV stack. Use `make install` then `make dev` for local development.
# Differences from infra/docker-compose.yml (production-style):
# - No Traefik / TLS — services exposed directly on localhost ports.
# - GPU services (worker, ollama) opt-in via profile=gpu.
# - Volumes mounted from host for hot reload.
# - Lower resource defaults; no NVENC/CUDA assumptions for CPU-only laptops.

name: astoka-dev

networks:
  astoka:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: astoka-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astoka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astoka}
      POSTGRES_DB: ${POSTGRES_DB:-astoka}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astoka} -d ${POSTGRES_DB:-astoka}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [astoka]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: astoka-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [astoka]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: astoka-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-astoka}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-astoka_dev_only}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [astoka]
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: astoka-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-astoka} ${MINIO_ROOT_PASSWORD:-astoka_dev_only};
      mc mb --ignore-existing local/${MINIO_BUCKET:-astoka};
      echo 'MinIO bucket ${MINIO_BUCKET:-astoka} ready';
      "
    networks: [astoka]
    restart: "no"

  ollama:
    # GPU-required for usable LLM speed; opt-in via --profile gpu.
    profiles: [gpu]
    image: ollama/ollama:latest
    container_name: astoka-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [astoka]
    restart: unless-stopped

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: astoka-api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astoka}:${POSTGRES_PASSWORD:-astoka}@postgres:5432/${POSTGRES_DB:-astoka}
      REDIS_URL: redis://redis:6379/0
      # Internal endpoint — server↔MinIO traffic (in-network).
      MINIO_ENDPOINT: minio:9000
      # Browser-facing endpoint — embedded in presigned PUT/GET URLs so uploads work.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-astoka}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-astoka_dev_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-astoka}
      OLLAMA_URL: http://ollama:11434
      API_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ../services/api:/app
    networks: [astoka]
    restart: unless-stopped

  worker:
    profiles: [worker]
    build:
      # Parent dir context lets the Dockerfile COPY sibling packages (api/, highlight/)
      # which worker's path deps in pyproject.toml require. Building from
      # `../services/worker` directly would put `../api` outside the build context
      # → uv would fail with "Distribution not found at: file:///api".
      context: ../services
      dockerfile: worker/Dockerfile
    container_name: astoka-worker
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astoka}:${POSTGRES_PASSWORD:-astoka}@postgres:5432/${POSTGRES_DB:-astoka}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-astoka}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-astoka_dev_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-astoka}
      OLLAMA_URL: http://ollama:11434
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-medium}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # No volume mounts — astoka-highlight is installed as a pip package now
    # (see worker/pyproject.toml). For hot-reload during dev, rebuild the
    # image with `make build` or mount /app/worker volume locally.
    networks: [astoka]
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: astoka-web
    env_file: ../.env
    environment:
      # Browser-facing (for any direct fetch from React; lib/api-client uses
      # relative /api/* so this is rarely hit).
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      # Server-side rewrite target — Next.js proxies /api/* to this inside the
      # container. Must use Docker DNS name, NOT localhost (which would resolve
      # to web container itself).
      INTERNAL_API_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    networks: [astoka]
    restart: unless-stopped
