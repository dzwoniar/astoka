repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]
        exclude: '^(packages/shared/src/api-types\.ts|services/highlight/vendor/.*)$'

  - repo: local
    hooks:
      - id: forbid-secrets
        name: forbid committed secrets
        entry: bash -c 'if grep -RnE "(BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY)" --include="*" --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv --exclude-dir=infra/traefik/certs .; then exit 1; fi'
        language: system
        pass_filenames: false
